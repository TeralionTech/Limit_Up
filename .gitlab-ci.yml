# GitLab CI/CD — hit_limit_up
#
# CI (自動): 每次 push / Merge Request 跑 pytest + 前端 tsc/build。
# CD (手動): main 分支上出現手動按鈕 — **刻意不自動部署**,因為這是真金交易系統,
#            不能在盤中被 merge 觸發自動重啟。
#   ▶ deploy         : VPS 拉碼 + 重啟 + 傳前端 dist + 同步/排程 avgvol 夜間 timer
#   ▶ avgvol-run-now : 立刻觸發一次「月均量全量計算」(不等 18:00;背景跑 ~35 分)
#
# Runner: 所有 job 都在「已註冊的 Runner」上執行 (GitLab 網站本身不跑指令)。
#         deploy/avgvol 用 group/project runner (docker executor) 再 ssh 進 VPS。
# 需要的前置 (GitLab 設定):
#   1. 可用的 docker-executor Runner (Settings → CI/CD → Runners)。
#   2. CI/CD 變數 (Settings → CI/CD → Variables,Protected + Masked):
#        VPS_SSH_KEY = 能登入 root@45.76.222.150 的私鑰 (File 型別最方便)。
#      且 VPS 的 git remote 要能取到本 GitLab 的 main。
#   ⚠ avgvol 計算會用富邦帳號登入 — 手動 avgvol-run-now 請挑主服務閒置時段按,免登入衝突。

stages: [test, build, deploy]

# ── CI: 後端測試 ────────────────────────────────────────────
test:
  stage: test
  image: python:3.12-slim
  cache:
    key: pip-$CI_COMMIT_REF_SLUG
    paths: [.cache/pip]
  variables:
    PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  before_script:
    - pip install -r requirements.txt -r requirements-dev.txt
  script:
    - python -m pytest tests -q
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'

# ── CI: 前端型別檢查 + build ─────────────────────────────────
frontend-build:
  stage: build
  image: node:20-slim
  cache:
    key: npm-$CI_COMMIT_REF_SLUG
    paths: [frontend/node_modules]
  before_script:
    - cd frontend && npm ci
  script:
    - npx tsc --noEmit
    - npm run build
  artifacts:
    paths: [frontend/dist]
    expire_in: 1 week
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'

# ── 共用: SSH 進 VPS 的前置 (Runner 上跑,連到 45.76.222.150) ──
.vps_ssh:
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh-client
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - cp "$VPS_SSH_KEY" ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
    - ssh-keyscan -H 45.76.222.150 >> ~/.ssh/known_hosts 2>/dev/null
  variables:
    VPS: root@45.76.222.150
    SSH: ssh -i ~/.ssh/id_deploy

# ── CD: 手動部署到 VPS (只在 main;按鈕觸發,非自動) ──────────
# 部署 = VPS 拉最新 main + 重啟 + 傳前端 dist + 同步/排程 avgvol 夜間 timer。
# 真金系統務必人工挑非交易時段按。
deploy:
  stage: deploy
  extends: .vps_ssh
  needs: [test, frontend-build]        # 測試+build 綠才可部署;帶 build 的 dist artifact
  script:
    # 後端: VPS 端拉碼 + 重啟 (VPS 的 origin 要能取到最新 main)
    - $SSH $VPS "cd /opt/hit_limit_up/repo && git fetch origin main && git reset --hard origin/main && systemctl restart hit-limit-up"
    # avgvol 夜間 timer: 同步 unit 檔 + 排程 (--now 啟動 timer 排 18:00,不會立刻跑計算)
    - $SSH $VPS "cp /opt/hit_limit_up/repo/deploy/hit-limit-up-avgvol.service /etc/systemd/system/ && cp /opt/hit_limit_up/repo/deploy/hit-limit-up-avgvol.timer /etc/systemd/system/ && systemctl daemon-reload && systemctl enable --now hit-limit-up-avgvol.timer && systemctl list-timers hit-limit-up-avgvol.timer --no-pager"
    # 前端: 傳 frontend-build 產出的 dist
    - $SSH $VPS "rm -rf /opt/hit_limit_up/repo/frontend/dist"
    - scp -i ~/.ssh/id_deploy -r frontend/dist $VPS:/opt/hit_limit_up/repo/frontend/
    - $SSH $VPS "cd /opt/hit_limit_up/repo && git log --oneline -1 && systemctl is-active hit-limit-up"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
  environment:
    name: production

# ── CD: 手動觸發一次「月均量全量計算」(不等 18:00 timer) ──────
# --no-block: 服務在 VPS 背景跑 ~35 分,CI job 幾秒就結束。
avgvol-run-now:
  stage: deploy
  extends: .vps_ssh
  script:
    - $SSH $VPS "systemctl start --no-block hit-limit-up-avgvol.service"
    - $SSH $VPS "sleep 3; systemctl is-active hit-limit-up-avgvol.service || true; journalctl -u hit-limit-up-avgvol.service -n 15 --no-pager"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
